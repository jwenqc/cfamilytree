<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Tree</title>
<meta name="theme-color" content="#1f6f78"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Family Tree">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><link rel="icon" href="icon-192.png">
<style>
:root{--bg:#eceff2;--card:#fff;--ink:#1d2a33;--mut:#6b7a86;--line:#8fa0ad;--acc:#1f6f78;--on:#fff;--m:#cfe3f1;--f:#f5d6df;--o:#e3e0d4;--sh:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141a1f;--card:#1f2830;--ink:#e8eef2;--mut:#93a3af;--line:#5d6f7c;--acc:#52b3bd;--on:#0c1a1d;--m:#27455a;--f:#5a2e3c;--o:#3b3a33;--sh:#1f2830}}
:root[data-theme="dark"]{--bg:#141a1f;--card:#1f2830;--ink:#e8eef2;--mut:#93a3af;--line:#5d6f7c;--acc:#52b3bd;--on:#0c1a1d;--m:#27455a;--f:#5a2e3c;--o:#3b3a33;--sh:#1f2830}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--bg);z-index:5}
h1{font:600 20px Georgia,"Times New Roman",serif;margin:0;flex:1}
.ib{min-width:40px;height:40px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;font:600 16px inherit;padding:0 10px}
#vp{flex:1;position:relative;overflow:hidden;touch-action:none;cursor:grab;background:radial-gradient(var(--line) 0.6px,transparent 0.7px) 0 0/22px 22px}
#cv{position:absolute;left:0;top:0;transform-origin:0 0}
#cv svg{position:absolute;left:0;top:0;pointer-events:none}
.card{position:absolute;width:160px;height:76px;border-radius:12px;padding:6px 8px;display:flex;align-items:center;gap:7px;background:var(--o);border:2px solid transparent;overflow:hidden;user-select:none}
.card.m{background:var(--m)}.card.f{background:var(--f)}
.card.sel{border-color:var(--acc)}
.card b{display:block;font:600 13px/1.2 Georgia,"Times New Roman",serif;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
.card i{display:block;font-style:normal;font-size:11px;color:var(--mut);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg{position:absolute;width:26px;height:26px;border-radius:13px;border:2px solid var(--line);background:var(--sh);color:var(--ink);font:600 12px/22px system-ui;text-align:center;padding:0}
#hint{position:absolute;left:12px;bottom:12px;font-size:12px;color:var(--mut);pointer-events:none;max-width:calc(100% - 70px)}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.25);padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s;z-index:10;max-height:80%;overflow:auto}
#sheet.on{transform:none}
#sheet h2{margin:0 0 10px;font:600 18px Georgia,serif;display:flex;justify-content:space-between;align-items:center}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:16px inherit}
textarea{resize:none;height:54px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btns button{flex:1 1 40%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:600 14px inherit}
.btns .pri{background:var(--acc);color:var(--on);border-color:var(--acc);flex-basis:100%}
.btns .dng{color:#c0392b}
.btns button:disabled{opacity:.4}
#sb{padding:0 12px 8px;position:relative;z-index:6}
#sr{max-height:40vh;overflow:auto;margin-top:6px;border-radius:10px;background:var(--card);border:1px solid var(--line)}
#sr:empty{display:none}
#sr button{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:11px 12px;border:0;border-bottom:1px solid var(--bg);background:none;color:var(--ink);font-size:15px}
#sr small{color:var(--mut)}.nr{margin:0;padding:11px 12px;color:var(--mut)}
#zc{position:absolute;right:10px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zc .ib{min-width:42px;height:42px;padding:0}
.av{flex:none;width:38px;height:38px;border-radius:50%;background:var(--card);display:grid;place-items:center;overflow:hidden;font:600 15px Georgia,serif;color:var(--mut)}
.av img{width:100%;height:100%;object-fit:cover}.av.big{width:56px;height:56px;font-size:22px}
.tx{min-width:0;flex:1}
.card.hit{outline:3px solid var(--acc);outline-offset:2px}
.ph{display:flex;align-items:center;gap:12px;margin-bottom:2px}
.pb{display:inline-block;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font-weight:600;font-size:14px;margin-right:6px}
#lg{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20}
#lg[hidden]{display:none}
#lg>div{background:var(--card);padding:16px;border-radius:14px;width:min(320px,90%)}
#lg h2{margin:0 0 6px;font:600 18px Georgia,serif}#lg p{margin:0 0 10px;color:var(--mut)}#le{color:#c0392b;min-height:1.2em}
.lk{position:absolute;left:30px;bottom:4px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:var(--acc);color:var(--on);font:700 10px/20px system-ui,sans-serif;text-align:center;text-decoration:none}
.lk::before{content:'';position:absolute;inset:-4px}
#fo{display:inline-block;margin-top:6px;color:var(--acc);font-weight:600}#fo[hidden]{display:none}
.card.gh{background:transparent;border:2px dashed var(--line)}
button.lk{border:0}
.up{position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:10px;border:0;background:var(--acc);color:var(--on);font-size:12px;padding:0}
.up::before{content:'';position:absolute;inset:-4px}
.sl{position:absolute;font:600 12px system-ui,sans-serif;color:var(--mut);white-space:nowrap}
#lm{position:fixed;z-index:15;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:4px}
#lm[hidden]{display:none}#lm a{display:block;padding:10px 14px;color:var(--ink);text-decoration:none;font-weight:600}
#fo a{display:inline-block;margin:6px 14px 0 0;color:var(--acc);font-weight:600}
#dm{margin:0 0 4px}.hn{font-size:12px;color:var(--mut);margin:8px 0 0}#dc[hidden]{display:none}
#ut{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:12;padding:12px 18px;border-radius:24px;border:0;background:var(--ink);color:var(--bg);font-weight:600;font-size:15px;box-shadow:0 4px 16px rgba(0,0,0,.3)}
#ut[hidden]{display:none}
</style></head>
<body>
<header><h1>Family tree</h1><button class="ib" id="sbtn">Find</button><button class="ib" id="ed" hidden>Unlock</button></header>
<div id="sb" hidden><input id="q" placeholder="Search by name or notes" autocomplete="off"><div id="sr"></div></div>
<div id="vp"><div id="cv"></div><div id="zc"><button class="ib" id="zi" aria-label="Zoom in">+</button><button class="ib" id="zo" aria-label="Zoom out">−</button><button class="ib" id="fit">Fit</button><button class="ib" id="rs" aria-label="Refresh from sheet">↻</button></div><div id="hint">Drag to move · pinch to zoom · tap a card to edit</div></div>
<div id="sheet">
<h2><span id="st">Edit person</span><button class="ib" id="x" aria-label="Close">✕</button></h2>
<div class="ph"><div id="pv" class="av big"></div><div id="pbt"><label class="pb" for="fi">Choose photo</label><button type="button" class="pb" id="prm">Remove</button></div><input id="fi" type="file" accept="image/*" hidden></div>
<label for="fn">Full name</label><input id="fn" autocomplete="off">
<div class="row"><div><label for="fb">Born (year)</label><input id="fb" placeholder="e.g. 1962"></div><div><label for="fd">Died</label><input id="fd" placeholder="optional"></div></div>
<label for="bm">Birthday (day and month)</label><div class="row"><select id="bm"><option value="">Month</option><option value="01">Jan</option><option value="02">Feb</option><option value="03">Mar</option><option value="04">Apr</option><option value="05">May</option><option value="06">Jun</option><option value="07">Jul</option><option value="08">Aug</option><option value="09">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option></select><input id="bdd" type="number" min="1" max="31" inputmode="numeric" placeholder="Day"></div>
<label for="fg">Gender</label><select id="fg"><option value="m">Male</option><option value="f">Female</option><option value="o">Other</option></select>
<div id="fpw" hidden><label for="fp">Child of</label><select id="fp"></select></div><label for="fl">Social media links (one per line)</label><textarea id="fl" placeholder="facebook.com/name&#10;x.com/name"></textarea><div id="fo"></div>
<label for="ft">Notes</label><textarea id="ft" placeholder="Place, occupation, story…"></textarea>
<div class="btns" id="bt"><button class="pri" id="sv">Save changes</button><button id="asp">Add spouse</button><button id="ach">Add child</button><button id="apr">Add parent</button><button id="mvl">← Older</button><button id="mvr">Younger →</button><button id="srt" style="flex-basis:100%">Sort children by birth year</button><button class="dng" id="del">Delete person</button></div>
<div id="dc" hidden><p id="dm"></p><div class="btns"><button id="d1" style="flex-basis:100%">Keep descendants, delete only this person</button><button class="dng" id="d2" style="flex-basis:100%">Delete all</button><button id="d3" style="flex-basis:100%">Cancel</button></div><p class="hn">“Keep descendants” turns this card into an “Unknown” placeholder, so the family below stays connected.</p></div>
</div>
<button id="ut" hidden>Undo delete</button>
<div id="lm" hidden></div>
<div id="lg" hidden><div><h2>Unlock editing</h2><p>Enter the edit code you were given.</p><input id="cd" type="password" autocomplete="off"><p id="le"></p><div class="btns"><button class="pri" id="lgo">Unlock</button><button id="lgx">Cancel</button></div></div></div>
<script>
const CW=160,CH=76,G=10,HG=14,VG=54,PAD=40,ROOTGAP=80;
const $=id=>document.getElementById(id);
const API='PASTE_YOUR_WEB_APP_URL_HERE'; // <- paste your Apps Script web app URL here (it ends in /exec)
const GAS=!/^PASTE/.test(API);
const call=b=>fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(b)}).then(r=>r.json()).then(j=>{if(!j.ok)throw new Error(j.error);return j.data});
const gs={run:{withSuccessHandler:ok=>({withFailureHandler:bad=>{const r=b=>call(b).then(ok,bad);return{applyChanges:(ch,c)=>r({action:'apply',changes:ch,code:c}),getData:c=>r({action:'data',code:c})}}})}};
let S={k:0,root:null,p:{},u:{}},base={people:[],units:[]},col={},busy=false,dirty=false,tmr=null,seq=0,locked=false,me='',canEdit=true,code='',ph='',flash=null,LO={};
try{col=JSON.parse(localStorage.getItem('ftcol'))||{}}catch(e){}
try{code=localStorage.getItem('ftcode')||''}catch(e){}
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const stat=t=>{$('hint').textContent=t+(locked?' · '+(me?'editing as '+me:'view only'):'')+' · drag to pan, pinch to zoom'};
function sample(){return{k:10,root:'u1',
p:{p1:{n:'Joseph Hale',b:'1938',g:'m'},p2:{n:'Rose Hale',b:'1941',g:'f'},p3:{n:'Anna Reyes',b:'1964',g:'f'},p4:{n:'Marco Reyes',b:'1962',g:'m'},p5:{n:'Tom Hale',b:'1967',g:'m'},p6:{n:'Mia Reyes',b:'1990',g:'f'}},
u:{u1:{m:['p1','p2'],c:['u2','u3'],x:false},u2:{m:['p3','p4'],c:['u4'],x:false},u3:{m:['p5'],c:[],x:false},u4:{m:['p6'],c:[],x:false}}}}
function setX(id,v){S.u[id].x=v;col[id]=v;try{localStorage.setItem('ftcol',JSON.stringify(col))}catch(e){}}
function flat(){const people=[],units=[];
 for(const id in S.u){const u=S.u[id],par=Object.keys(S.u).find(k=>S.u[k].c.includes(id))||'';
  units.push({id,parent:par,order:par?S.u[par].c.indexOf(id):0,from:u.f||'',ref:u.ref||'',side:u.side||''});
  u.m.forEach((pid,i)=>{const p=S.p[pid];people.push({id:pid,unit:id,slot:i,name:p.n||'',born:p.b||'',died:p.d||'',gender:p.g||'o',notes:p.t||'',photo:p.ph||'',link:p.l||'',bday:p.bd||''})})}
 return{people,units}}
function load(d){const u={},p={},us=d.units.slice().sort((a,b)=>a.order-b.order);
 us.forEach(r=>u[r.id]={m:[],c:[],x:!!col[r.id],f:r.from||'',ref:r.ref||'',side:r.side||''});
 d.people.slice().sort((a,b)=>a.slot-b.slot).forEach(r=>{if(u[r.unit]){u[r.unit].m.push(r.id);p[r.id]={n:r.name,b:r.born,d:r.died,g:r.gender||'o',t:r.notes,ph:/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]*$/.test(r.photo||'')?r.photo:'',l:lk(r.link).join(' '),bd:/^\d\d-\d\d$/.test(r.bday||'')?r.bday:''}}});
 for(const id in u)if(!u[id].m.length&&!(u[id].ref&&p[u[id].ref]))delete u[id];
 let root=null;
 us.forEach(r=>{if(!u[r.id])return;if(r.parent&&u[r.parent])u[r.parent].c.push(r.id);else if(!root&&!r.side)root=r.id});
 S={k:0,root,p,u};base=flat();
 {const gs=Object.keys(S.u).filter(k=>S.u[k].ref);if(gs.length){gs.forEach(k=>{const par=parentOf(k);if(par)S.u[par].c=S.u[par].c.filter(c=>c!==k);delete S.u[k]});if(canEdit)save()}}
 if(root)return null;
 const id=nid('p'),n=nid('u');S.p[id]={n:'',g:'o'};S.u[n]={m:[id],c:[],x:false};S.root=n;if(canEdit)save();return canEdit?id:null}
function diff(){const a=flat(),m=r=>Object.fromEntries(r.map(x=>[x.id,JSON.stringify(x)])),bp=m(base.people),bu=m(base.units),ap=m(a.people),au=m(a.units);
 return{people:a.people.filter(r=>bp[r.id]!==ap[r.id]),units:a.units.filter(r=>bu[r.id]!==au[r.id]),delPeople:Object.keys(bp).filter(i=>!(i in ap)),delUnits:Object.keys(bu).filter(i=>!(i in au))}}
function save(){if(!GAS){try{localStorage.setItem('ft1',JSON.stringify(S))}catch(e){}return}
 seq++;dirty=true;stat('Saving…');clearTimeout(tmr);tmr=setTimeout(push,500)}
function push(){if(busy){tmr=setTimeout(push,400);return}
 const ch=diff(),s=seq;
 if(!ch.people.length&&!ch.units.length&&!ch.delPeople.length&&!ch.delUnits.length){dirty=false;stat('Saved to Google Sheet');return}
 const snap=flat();busy=true;
 gs.run.withSuccessHandler(d=>{busy=false;base=snap;if(s===seq){dirty=false;const k=sel;load(d);if(k&&!S.p[k]){$('sheet').classList.remove('on');sel=null}render();stat('Saved to Google Sheet')}})
 .withFailureHandler(e=>{busy=false;if(/Not allowed/.test((e&&e.message)||e)){me='';ui();stat('Your edit code was not accepted');pull();return}stat('Offline, retrying');tmr=setTimeout(push,4000)}).applyChanges(ch,code)}
function ui(){canEdit=!locked||!!me;$('ed').hidden=!locked;$('ed').textContent=me?'Sign out':'Unlock'}
function pull(first){gs.run.withSuccessHandler(d=>{locked=!!d.locked;me=d.me||'';ui();const nb=load(d);render();if(first)fit();stat('Synced with Google Sheet');
  if(!$('lg').hidden){if(me)$('lg').hidden=true;else $('le').textContent='That code was not recognised.'}
  if(nb)openP(nb,true)}).withFailureHandler(e=>stat('Could not load: '+((e&&e.message)||e))).getData(code)}
let sel=null,tx=0,ty=0,sc=1,W=0,H=0,MW=0,MH=0,SB={},LC={},armed=false;
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const PL=[[/facebook\.com|fb\.com|fb\.me/,'f','Facebook'],[/instagram\.com/,'ig','Instagram'],[/(^|\.)x\.com$|twitter\.com/,'X','X'],[/tiktok\.com/,'tt','TikTok'],[/linkedin\.com/,'in','LinkedIn'],[/youtube\.com|youtu\.be/,'yt','YouTube']];
function plat(u){let h='';try{h=new URL(u).hostname}catch(e){}const m=PL.find(x=>x[0].test(h));return m?[m[1],m[2]]:['↗','link']}
function safeUrl(s){s=(s||'').trim();if(!s)return'';if(!/^[a-z][a-z0-9+.-]*:/i.test(s))s='https://'+s;try{const u=new URL(s);return/^https?:$/.test(u.protocol)&&u.hostname.includes('.')?u.href:''}catch(e){return''}}
const lk=s=>String(s||'').split(/[\s,]+/).map(safeUrl).filter(Boolean).slice(0,6);
const lbl=u=>plat(u)[1]==='link'?new URL(u).hostname:plat(u)[1];
const MON='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' ');
function bd(s){const m=/^(\d\d)-(\d\d)$/.exec(s||'');return m?'🎂 '+(+m[2])+' '+MON[+m[1]-1]:''}
const own=u=>u.ref?CW:u.m.length*CW+(u.m.length-1)*G;
const disp=u=>{if(u.ref)return[u.ref];if(u.m.length<3)return u.m;const d=[u.m[0]];u.m.slice(1).forEach((p,i)=>i%2?d.unshift(p):d.push(p));return d};
const anc=(u,c)=>{const f=S.u[c].f;return u.m.includes(f)?f:u.m[1]};
const sib=u=>{if(u.m.length<3)return u.c;const d=disp(u);return u.c.map((c,i)=>[c,d.indexOf(anc(u,c)),i]).sort((a,b)=>a[1]-b[1]||a[2]-b[2]).map(a=>a[0])};
const kids=u=>u.x||u.side?[]:sib(u);
function wd(u){const o=own(u),k=kids(u);if(!k.length)return o;let s=-HG;k.forEach(c=>s+=wd(S.u[c])+HG);return Math.max(o,s)}
function lay(id){if(LC[id])return LC[id];const u=S.u[id],ks=kids(u),kl=ks.map(lay),o=own(u),offs=[];let gw=0;
 kl.forEach((l,i)=>{offs.push(gw);gw+=l.w+(i<kl.length-1?HG:0)});
 const d=disp(u),ss=(SB[id]||[]).map(q=>({q,x:d.indexOf(S.u[q].side)*(CW+G)+CW/2,w:own(S.u[q])})).filter(s=>s.x>0).sort((a,b)=>a.x-b.x);
 for(let i=1;i<ss.length;i++){const m=ss[i-1].x+ss[i-1].w/2+HG+ss[i].w/2;if(ss[i].x<m)ss[i].x=m}
 const ob=[];kl.forEach((l,i)=>l.sint.forEach(([a,b])=>ob.push([offs[i]+a,offs[i]+b])));
 const ideal=gw/2-o/2,hit=x=>ob.some(([a,b])=>x<b+HG&&x+o>a-HG);let xl=ideal;
 if(ob.length&&hit(xl)){const Lx=Math.min(...ob.map(r=>r[0]))-HG-o,Rx=Math.max(...ob.map(r=>r[1]))+HG;xl=Math.abs(Lx-ideal)<=Math.abs(Rx-ideal)?Lx:Rx}
 const sl=ss.map(s=>({q:s.q,l:xl+s.x-s.w/2,w:s.w,cx:xl+s.x})),mn=Math.min(0,xl,...sl.map(s=>s.l)),mx=Math.max(gw,xl+o,...sl.map(s=>s.l+s.w));
 return LC[id]={w:mx-mn,cl:xl-mn,gs:-mn,offs,ks,stubs:sl.map(s=>({q:s.q,l:s.l-mn,cx:s.cx-mn,w:s.w})),sint:sl.map(s=>[s.l-mn,s.l-mn+s.w])}}
function place(id,x0,y,o){const u=S.u[id],L=lay(id),d=disp(u),l=x0+L.cl,cx=l+own(u)/2;
 o[id]={l,y,cx,ax:L.stubs.length?l+d.indexOf(u.m[0])*(CW+G)+CW/2:cx,st:L.stubs.map(s=>({q:s.q,cx:x0+s.cx}))};let b=y+CH;
 L.stubs.forEach(s=>{o[s.q]={l:x0+s.l,y:y-CH-VG,cx:x0+s.cx,ax:x0+s.cx}});
 L.ks.forEach((c,i)=>{b=Math.max(b,place(c,x0+L.gs+L.offs[i],y+CH+VG,o))});return b}
function render(){
SB={};LC={};Object.keys(S.u).forEach(k=>{const q=S.u[k];if(q.side){const h=unitOf(q.side);if(h)(SB[h]=SB[h]||[]).push(k)}});
const o={},rs=[S.root,...Object.keys(S.u).filter(k=>k!==S.root&&!parentOf(k)&&!S.u[k].side)];let x0=PAD;
rs.forEach((id,i)=>{const L=lay(id),b=place(id,x0,PAD+(L.stubs.length?CH+VG:0),o);if(!i){MW=L.w+PAD*2;MH=b+PAD}x0+=L.w+ROOTGAP});
LO=o;W=x0-ROOTGAP+PAD;H=Math.max(...Object.values(o).map(r=>r.y))+CH+PAD+20;
let svg='',h='';
for(const id in o){const u=S.u[id],r=o[id];
